# Experimental crowded-scene profile; compare before a full run.
[dino]
model = "dino_vits16"
resolution = 512
device = "auto" # CUDA when available; CPU for correctness tests only
mixed_precision = true # CUDA only; spectral decomposition stays float64 on CPU

[maskcut]
tau = 0.15
epsilon = 0.00001
max_objects = 12
min_mask_area = 0.003
max_mask_iou = 0.5
crf = false
# Retain separate connected objects. Optional refinement is OFF after visual checks.
# No semantic labels or extra DINO crop calls.
all_components = true
split_depth = 0 # optional 1..4; can split one person into body parts
split_min_patches = 8
split_temperature = 0.05
split_max_ncut = 0.15
split_min_cosine_distance = 0.1
max_instances = 24

[filtering]
min_box_area = 0.002
max_box_area = 0.95
max_aspect_ratio = 10.0
duplicate_iou = 0.9

[pipeline]
output_dir = "pseudo/coco-crowded"
decode_workers = 4 # threads, never CUDA processes
queue_batches = 2 # bound CPU jobs to workers + batch * queue_batches
progress_interval = 1.0
rolling_seconds = 30.0
fsync = true # atomic writes + durable per-image completion receipts
seed = 0

[benchmark]
smoke_images = 100
scaling_images = 1000
confirmation_images = 10000
repeats = 2
min_stability_ratio = 0.85 # slowest/fastest repeated end-to-end throughput
batch_sizes = [8, 16, 32, 64, 128]
worker_counts = [] # automatic powers of 2 + effective physical-core limit
max_workers = 0 # 0 = automatic; constrained by affinity, CPU quota, RAM
preview_images = 64
imagenet_images = 1281167
target_images_per_sec = 14.83

[train]
run_name = "coco-yolo11n-crowded"
epochs = 100
image_size = 640
batch_size = 16
workers = 8
device = "auto"
seed = 0
patience = 30
progress_interval = 10.0
